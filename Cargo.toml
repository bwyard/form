[workspace]
members = [
    "crates/form-sdf",
    "crates/form-noise",
    "crates/form-animate",
    "crates/form-render",
]
resolver = "2"

[workspace.dependencies]
glam        = "0.27"
prime-sdf   = { path = "../prime/crates/prime-sdf" }
prime-noise = { path = "../prime/crates/prime-noise" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bwyard/form"
