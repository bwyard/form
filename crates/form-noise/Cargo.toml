[package]
name        = "form-noise"
description = "Noise functions for procedural graphics — value noise, Perlin, FBM, Worley, domain warping"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
keywords    = ["noise", "procedural", "graphics", "perlin", "fbm"]
categories  = ["graphics", "game-engines", "mathematics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prime-noise = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
