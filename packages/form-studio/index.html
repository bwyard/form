<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #06060f;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
    }
    canvas {
      image-rendering: pixelated;
      border: 1px solid #222;
    }
    #controls {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 12px;
      color: #666;
    }
    button {
      background: #111;
      border: 1px solid #333;
      color: #ccc;
      padding: 4px 12px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { border-color: #666; color: #fff; }
    #time { min-width: 60px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="512" height="512"></canvas>
  <div id="controls">
    <button id="btn">pause</button>
    <span id="time">t = 0.000</span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
